<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="erba" width="512" height="100" patternUnits="userSpaceOnUse" y="6">
      <rect width="512" height="50" fill="#0f6a42"/>
      <rect y="50" width="512" height="50" fill="#0c5c39"/>
    </pattern>
    <radialGradient id="luce" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
    <filter id="ombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- prato a strisce -->
  <rect width="512" height="512" fill="url(#erba)"/>
  <rect width="512" height="512" fill="url(#luce)"/>

  <!-- linee del campo -->
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#ombra)">
    <rect x="96" y="56" width="320" height="400" rx="2"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <circle cx="256" cy="256" r="50"/>

    <!-- area superiore -->
    <path d="M168 56 V122 H344 V56"/>
    <path d="M218 56 V80 H294 V56"/>
    <path d="M212.4 122 A48 48 0 0 0 299.6 122"/>
    <!-- area inferiore -->
    <path d="M168 456 V390 H344 V456"/>
    <path d="M218 456 V432 H294 V456"/>
    <path d="M212.4 390 A48 48 0 0 1 299.6 390"/>

    <!-- porte -->
    <path d="M234 56 V42 H278 V56" stroke-width="6"/>
    <path d="M234 456 V470 H278 V456" stroke-width="6"/>

    <!-- bandierine d'angolo -->
    <path d="M96 70 A14 14 0 0 0 110 56" stroke-width="5"/>
    <path d="M402 56 A14 14 0 0 0 416 70" stroke-width="5"/>
    <path d="M110 456 A14 14 0 0 0 96 442" stroke-width="5"/>
    <path d="M416 442 A14 14 0 0 0 402 456" stroke-width="5"/>
  </g>

  <!-- punti: centro e rigori -->
  <g fill="#fff">
    <circle cx="256" cy="256" r="7"/>
    <circle cx="256" cy="100" r="5"/>
    <circle cx="256" cy="412" r="5"/>
  </g>
</svg>
